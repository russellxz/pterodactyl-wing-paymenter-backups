# deploy/nginx.conf - Configuración de Nginx para PteroBackups
#
# 1. Copia este archivo a:        /etc/nginx/sites-available/pterobackups.conf
# 2. Cambia "copias.tudominio.com" por tu dominio real (en las 2 líneas server_name).
# 3. Crea el certificado de origen en Cloudflare (SSL/TLS > Servidor de origen >
#    Crear certificado) y pega el certificado y la clave en:
#       /etc/ssl/cloudflare/cert.pem
#       /etc/ssl/cloudflare/key.pem
# 4. Activa el sitio y recarga Nginx:
#       sudo ln -s /etc/nginx/sites-available/pterobackups.conf /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# 5. En Cloudflare pon el modo SSL/TLS en "Full (strict)" y apunta el DNS
#    (nube naranja activada) a la IP de este VPS.

server {
    listen 80;
    server_name copias.tudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name copias.tudominio.com;

    # Certificado de ORIGEN de Cloudflare
    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Descargas y subidas grandes (los .zip pueden pesar mucho)
    client_max_body_size 0;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;

        # Necesario para Socket.IO (progreso en tiempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No cortar las descargas de copias grandes
        proxy_buffering off;
    }
}
